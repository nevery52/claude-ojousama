<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Claude 大小姐 · 眨眼测试</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #f5f1ea; font-family: "Microsoft YaHei", sans-serif; color: #6b4a33; }
  .stage { position: relative; width: 360px; height: 360px; animation: breathe 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #closed { opacity: 0; }
  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }
  p { margin-top: 18px; font-size: 14px; opacity: .7; }
</style>
</head>
<body>
<div class="stage">
  <img id="open" src="art/base_v5_gemini.jpg" alt="Claude 大小姐">
  <img id="closed" src="art/blink_v1.jpg" alt="">
</div>
<p>眨眼 + 呼吸 测试（白底之后会抠掉）</p>
<script>
const closed = document.getElementById('closed');
function blink(twice) {
  closed.style.opacity = 1;
  setTimeout(() => {
    closed.style.opacity = 0;
    if (twice) setTimeout(() => blink(false), 180);
  }, 120);
}
(function loop() {
  setTimeout(() => { blink(Math.random() < 0.25); loop(); }, 2500 + Math.random() * 3000);
})();
</script>
</body>
</html>
