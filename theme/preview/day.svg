      <!-- 黑缎带 -->
      <path d="M-20,-66 l-8,-5 l1,10 Z M-20,-66 l-9,4 l8,5 Z" fill="#2a2326"/>
      <circle cx="-20" cy="-66" r="2" fill="#2a2326"/>
    </g>
   </g>
    
  </g>
    </g>
      
    <!-- 桌面 -->
    <rect class="wd" x="40" y="772" width="600" height="18" rx="4" fill="#c7a27c"/>
    <rect class="wdd" x="60" y="790" width="560" height="220" fill="#a7835f" opacity="0.6"/>
    <!-- 台灯 -->
    <g transform="translate(500 772)">
      <defs>
        <radialGradient id="halo"><stop offset="0" stop-color="#ffd696" stop-opacity="0.32"/><stop offset="1" stop-color="#ffd696" stop-opacity="0"/></radialGradient>
        <radialGradient id="flash"><stop offset="0" stop-color="#ffd59a" stop-opacity="0.75"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
      </defs>
      
      <ellipse class="flash" cx="-10" cy="-120" rx="260" ry="220" fill="url(#flash)" opacity="0"/>
      <rect x="-26" y="-8" width="52" height="8" rx="3" fill="#6b5644" opacity="0.5"/>
      <path d="M0,-8 L-30,-110 L-6,-150" stroke="#6b5644" stroke-width="5" fill="none" opacity="0.55" stroke-linecap="round"/>
      <path d="M-40,-176 L30,-156 L14,-120 L-48,-138 Z" fill="#e9c58f"/>
    </g>
    <!-- 一摞书，书签垂下来，末端一颗小星星 -->
