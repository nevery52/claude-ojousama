      <path d="M260,420 q60,-40 120,-10 t140,-20 L520,470 L240,470 Z" fill="#d8e5d0" opacity="0.8"/></g>
    <rect x="240" y="120" width="290" height="350" rx="6" fill="none" stroke="#c9b49a" stroke-width="10"/>
