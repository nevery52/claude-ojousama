      <rect x="52" y="479" width="13" height="53" rx="2" fill="#c98b5a"/><rect x="67" y="466" width="20" height="66" rx="2" fill="#5d6f8a"/><rect x="89" y="475" width="18" height="57" rx="2" fill="#a8654a"/><rect x="109" y="462" width="16" height="70" rx="2" fill="#7a8a6a"/><rect x="127" y="471" width="14" height="61" rx="2" fill="#d9b07a"/><rect x="143" y="480" width="12" height="52" rx="2" fill="#6a5a7a"/><rect x="157" y="467" width="19" height="65" rx="2" fill="#8a5a3a"/><rect x="178" y="476" width="17" height="56" rx="2" fill="#c98b5a"/>
      <rect x="50" y="616" width="16" height="56" rx="2" fill="#7a8a6a"/><rect x="68" y="603" width="14" height="69" rx="2" fill="#d9b07a"/><rect x="84" y="612" width="12" height="60" rx="2" fill="#6a5a7a"/><rect x="98" y="599" width="19" height="73" rx="2" fill="#8a5a3a"/><rect x="119" y="608" width="17" height="64" rx="2" fill="#c98b5a"/><rect x="138" y="617" width="15" height="55" rx="2" fill="#5d6f8a"/><rect x="155" y="604" width="13" height="68" rx="2" fill="#a8654a"/>
      
  <g transform="translate(122 392) scale(1.55)">
   <g class="anim sway">
    <g transform="">
      <!-- 后面的头发（毛线） -->
      <path d="M-24,-56 C-26,-84 26,-84 24,-56 L26,-14 C18,-8 12,-16 10,-22 L-10,-22 C-12,-16 -18,-8 -26,-14 Z" fill="#e3843f"/>
      <path d="M-22,-40 q-3,10 0,20 M22,-40 q3,10 0,20" stroke="#c96d2f" stroke-width="1.6" fill="none"/>
