<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Claude 大小姐 · 表情一览</title>
<style>
  body { margin: 0; padding: 24px; background: #f5f1ea; font-family: "Microsoft YaHei", sans-serif; color: #6b4a33; text-align: center; }
  .stage { position: relative; width: 300px; height: 300px; margin: 0 auto; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .25s; }
  .stage.pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(1, 1); } 30% { transform: scale(1.06, .9); } 60% { transform: scale(.97, 1.04); } 100% { transform: scale(1, 1); } }
  #label { margin: 12px 0 18px; font-size: 18px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 820px; margin: 0 auto; }
  .grid button { border: 2px solid transparent; background: #fff; border-radius: 12px; padding: 6px; cursor: pointer; width: 84px; color: #6b4a33; font-family: inherit; }
  .grid button.on { border-color: #d97a4a; }
  .grid img { width: 70px; height: 70px; display: block; margin: 0 auto 4px; }
  .grid span { font-size: 12px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <img id="a" src="art/base_v5_gemini.jpg" alt="">
  <img id="b" src="art/base_v5_gemini.jpg" alt="" style="opacity:0">
</div>
<div id="label">待机</div>
<div class="grid" id="grid"></div>
<script>
const states = [
  ['待机', 'base_v5_gemini.jpg'], ['眨眼', 'blink_v1.jpg'], ['思考中', 'think_v1.jpg'],
  ['干活中', 'work_v1.jpg'], ['等你确认', 'ask_v1.jpg'], ['完成', 'happy_v1.jpg'],
  ['累了', 'tired_v2.jpg'], ['睡着', 'sleep_v1.jpg'], ['被点到', 'poke_v1.jpg'], ['托腮看着你', 'gaze_v1.jpg'],
];
const a = document.getElementById('a'), b = document.getElementById('b');
const stage = document.getElementById('stage'), label = document.getElementById('label'), grid = document.getElementById('grid');
let front = a, back = b;

// 两张图交替淡入淡出，切换表情时不会生硬地跳
function show(i) {
  const [name, file] = states[i];
  back.src = 'art/' + file;
  back.style.opacity = 1; front.style.opacity = 0;
  [front, back] = [back, front];
  label.textContent = name;
  [...grid.children].forEach((btn, j) => btn.classList.toggle('on', j === i));
  if (name === '被点到') { stage.classList.remove('pop'); void stage.offsetWidth; stage.classList.add('pop'); }
}

states.forEach(([name, file], i) => {
  const btn = document.createElement('button');
  btn.innerHTML = `<img src="art/${file}" alt=""><span>${name}</span>`;
  btn.onclick = () => show(i);
  grid.appendChild(btn);
});
stage.onclick = () => show(8);
grid.children[0].classList.add('on');
</script>
</body>
</html>
